<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دَون فيديو — تسجيل الدخول</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬇️</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0d12; --surface: #151926; --line: #262c3d;
    --text: #e7ebf5; --dim: #9aa3b8; --accent: #5b8cff; --accent2: #7b5bff; --err: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f6fb; --surface: #fff; --line: #dfe4ef; --text: #131722; --dim: #5a6478; }
  }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: "SF Arabic", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans Arabic", sans-serif;
    background: radial-gradient(900px 460px at 80% -10%, rgba(123,91,255,.16), transparent 60%),
                radial-gradient(760px 400px at 10% -6%, rgba(91,140,255,.18), transparent 58%), var(--bg);
    color: var(--text); -webkit-font-smoothing: antialiased;
  }
  .box {
    width: min(380px, 100%); background: var(--surface);
    border: 1px solid var(--line); border-radius: 20px; padding: 32px 26px;
    box-shadow: 0 12px 44px rgba(0,0,0,.35); text-align: center;
  }
  .mark {
    width: 52px; height: 52px; margin: 0 auto 16px; border-radius: 16px;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    box-shadow: 0 8px 22px rgba(91,140,255,.38);
  }
  .mark svg { width: 26px; height: 26px; }
  h1 { font-size: 19px; font-weight: 700; }
  p.sub { font-size: 13px; color: var(--dim); margin-top: 5px; margin-bottom: 22px; }
  input {
    width: 100%; height: 46px; padding: 0 14px; border-radius: 12px;
    background: var(--bg); border: 1.5px solid var(--line); color: var(--text);
    font-size: 15px; outline: none; text-align: center; letter-spacing: .5px;
    transition: border-color .18s, box-shadow .18s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(91,140,255,.16); }
  button {
    width: 100%; height: 46px; margin-top: 12px; border: none; border-radius: 12px;
    background: linear-gradient(140deg, var(--accent), var(--accent2));
    color: #fff; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer;
    transition: filter .2s, transform .12s;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: not-allowed; }
  .err {
    margin-top: 14px; padding: 10px 13px; border-radius: 10px; font-size: 13px;
    background: rgba(255,107,107,.12); border: 1px solid rgba(255,107,107,.3); color: #ff9c9c;
  }
  .err[hidden] { display: none; }
</style>
</head>
<body>
  <form class="box" id="form">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 21h16"/>
      </svg>
    </div>
    <h1>دَون فيديو</h1>
    <p class="sub">أدخل كلمة المرور للمتابعة</p>
    <input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password" autofocus>
    <button id="btn" type="submit">دخول</button>
    <div class="err" id="err" hidden></div>
  </form>

<script>
  const form = document.getElementById('form');
  const err = document.getElementById('err');
  const btn = document.getElementById('btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.hidden = true;
    btn.disabled = true;
    btn.textContent = 'جارٍ التحقق…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (res.ok) { location.replace('/'); return; }
      const d = await res.json().catch(() => ({}));
      err.textContent = d.error || 'كلمة المرور غير صحيحة';
      err.hidden = false;
    } catch {
      err.textContent = 'تعذّر الاتصال بالخادم';
      err.hidden = false;
    }
    btn.disabled = false;
    btn.textContent = 'دخول';
    document.getElementById('pw').select();
  });
</script>
</body>
</html>
